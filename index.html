<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="课表">
<meta name="theme-color" content="#3b74e8">
<title>课表</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<!-- 不引用 manifest.json：iOS 16.4+ 会用 manifest 的 start_url 作为添加主屏的启动地址，丢失 URL hash 里的课表数据 -->
<style>
/* iOS 兼容：不用 inset / flex gap；safe-area 用双声明回退 */
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:#f4f6fb;color:#222;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
button{font-family:inherit}

#hd{position:-webkit-sticky;position:sticky;top:0;z-index:10;background:rgba(255,255,255,.94);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid #eceef4;
    padding:10px 14px 8px;padding:calc(env(safe-area-inset-top) + 10px) 14px 8px}
.hd-row{display:flex;align-items:baseline}
.hd-title{font-size:17px;font-weight:600}
.hd-sub{font-size:11px;color:#999;margin-top:2px}
.chips{display:flex;overflow-x:auto;padding:8px 0 2px;-webkit-overflow-scrolling:touch}
.chip{flex:none;margin-right:6px;border:1px solid #e3e6ef;background:#f7f8fc;color:#555;border-radius:14px;padding:4px 11px;font-size:12px}
.chip.on{background:#3b74e8;border-color:#3b74e8;color:#fff;font-weight:600}

#main{padding:6px 8px 20px;padding:6px 8px calc(20px + env(safe-area-inset-bottom));overflow-x:auto;-webkit-overflow-scrolling:touch}
.allday{padding:4px 4px 2px;font-size:11px;color:#888}
.allday .tag{display:inline-block;background:#fff;border:1px solid #eceef4;border-radius:6px;padding:2px 6px;margin:2px 4px 2px 0;color:#555}
.grid{display:flex;min-width:560px}
.gridhead{display:flex;min-width:560px}
.timecol{width:34px;flex:none}
.corner{height:34px}
.tlabel{height:46px;font-size:10px;color:#bbb;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.tlabel b{font-weight:600}
.tlabel i{font-size:8px;color:#b9bdc9;font-style:normal}
.days{flex:1;display:grid;grid-template-columns:repeat(7,1fr)}
.daycol{position:relative;border-left:1px dashed #eef0f5}
.dayhead{height:34px;text-align:center;font-size:11px;color:#666;background:#fff;border-left:1px dashed #eef0f5}
.gridhead .dayhead{border-left:none}
.dayhead b{display:block;font-size:12px;color:#333}
.dayhead.today b{color:#3b74e8}
.dayhead.today{background:#eef4ff;border-radius:6px}
.bgline{height:46px;border-bottom:1px dashed #f0f2f7}
.card{position:absolute;left:2px;right:2px;border-radius:7px;padding:3px 5px;font-size:11px;line-height:1.25;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card b{display:block;font-size:11px;font-weight:600;white-space:normal}
.card span{display:block;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.exam{background:#ffeef1!important;color:#c0354f!important}
.card.temp{background:#fff7e8!important;color:#9a5a10!important}
.empty{padding:60px 10px;text-align:center;color:#999;font-size:13px;line-height:1.8}

.hero{padding:56px 26px 40px;text-align:center;color:#666;font-size:14px;line-height:1.9}
.hero-badge{display:inline-block;background:#3b74e8;color:#fff;font-weight:700;font-size:26px;width:60px;height:60px;line-height:60px;border-radius:16px;margin-bottom:14px}
.hero h1{font-size:19px;color:#222;margin-bottom:14px}
.hero .steps{display:inline-block;text-align:left;background:#fff;border:1px solid #eceef4;border-radius:12px;padding:14px 18px;font-size:13px;line-height:2.1}
.hero a{color:#3b74e8;text-decoration:none}

#banner{position:fixed;left:12px;right:12px;bottom:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:50;
    background:#1d2634;color:#fff;border-radius:12px;padding:13px 40px 13px 14px;font-size:13px;line-height:1.7;
    box-shadow:0 8px 28px rgba(0,0,0,.3)}
#banner b{color:#8fb6ff}
#banner-close{position:absolute;top:6px;right:10px;border:none;background:none;color:#8a93a6;font-size:18px;padding:6px}
</style>
</head>
<body>

<div id="hd" style="display:none">
    <div class="hd-row"><div class="hd-title" id="hd-title">课表</div></div>
    <div class="hd-sub" id="hd-sub"></div>
    <div class="chips" id="chips"></div>
</div>

<div id="main"></div>

<div id="hero" class="hero" style="display:none">
    <div class="hero-badge">课</div>
    <h1>课表离线查看器</h1>
    <div class="steps" id="hero-browser">
        ① 用 Safari 打开 <a href="https://njw.cqie.edu.cn/workspace/curriculum">教务课表页</a>（课表助手会自动缓存全学期课表）<br>
        ② 点课表助手面板顶部的「⇪」按钮跳转到本页<br>
        ③ 数据自动保存后，按提示「添加到主屏幕」<br>
        ④ 以后点桌面图标直接看课表，无需联网、无需登录
    </div>
    <div class="steps" id="hero-standalone" style="display:none">
        还没有课表数据。<br><br>
        请回到 <b>Safari 浏览器</b> 打开教务课表页，点课表助手面板的「⇪」同步，落地后重新「添加到主屏幕」覆盖本图标即可。<br><br>
        （iOS 主屏应用与 Safari 存储相互独立，数据只能从落地页带入）
        <div id="hero-diag" style="margin-top:12px;font-size:11px;color:#bbb"></div>
    </div>
</div>

<div id="banner" style="display:none">
    <span id="banner-text"></span>
    <button id="banner-close" type="button">×</button>
</div>

<script>
(function () {
'use strict';

/* ===== LZ-String 1.4.4 (MIT, github.com/pieroxy/lz-string) 仅解压 ===== */
var LZString = (function () {
    var f = String.fromCharCode;
    var keyStrUriSafe = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+-$';
    var baseReverseDic = {};
    function getBaseValue(alphabet, character) {
        if (!baseReverseDic[alphabet]) {
            baseReverseDic[alphabet] = {};
            for (var i = 0; i < alphabet.length; i++) baseReverseDic[alphabet][alphabet.charAt(i)] = i;
        }
        return baseReverseDic[alphabet][character];
    }
    function _decompress(length, resetValue, getNextValue) {
        var dictionary = [], next, enlargeIn = 4, dictSize = 4, numBits = 3,
            entry = '', result = [], i, w, bits, resb, maxpower, power, c,
            data = { val: getNextValue(0), position: resetValue, index: 1 };
        for (i = 0; i < 3; i += 1) dictionary[i] = i;
        bits = 0; maxpower = Math.pow(2, 2); power = 1;
        while (power != maxpower) {
            resb = data.val & data.position;
            data.position >>= 1;
            if (data.position == 0) { data.position = resetValue; data.val = getNextValue(data.index++); }
            bits |= (resb > 0 ? 1 : 0) * power;
            power <<= 1;
        }
        switch (next = bits) {
            case 0:
                bits = 0; maxpower = Math.pow(2, 8); power = 1;
                while (power != maxpower) {
                    resb = data.val & data.position;
                    data.position >>= 1;
                    if (data.position == 0) { data.position = resetValue; data.val = getNextValue(data.index++); }
                    bits |= (resb > 0 ? 1 : 0) * power;
                    power <<= 1;
                }
                c = f(bits);
                break;
            case 1:
                bits = 0; maxpower = Math.pow(2, 16); power = 1;
                while (power != maxpower) {
                    resb = data.val & data.position;
                    data.position >>= 1;
                    if (data.position == 0) { data.position = resetValue; data.val = getNextValue(data.index++); }
                    bits |= (resb > 0 ? 1 : 0) * power;
                    power <<= 1;
                }
                c = f(bits);
                break;
            case 2:
                return '';
        }
        dictionary[3] = c;
        w = c;
        result.push(c);
        while (true) {
            if (data.index > length) return '';
            bits = 0; maxpower = Math.pow(2, numBits); power = 1;
            while (power != maxpower) {
                resb = data.val & data.position;
                data.position >>= 1;
                if (data.position == 0) { data.position = resetValue; data.val = getNextValue(data.index++); }
                bits |= (resb > 0 ? 1 : 0) * power;
                power <<= 1;
            }
            switch (next = bits) {
                case 0:
                    bits = 0; maxpower = Math.pow(2, 8); power = 1;
                    while (power != maxpower) {
                        resb = data.val & data.position;
                        data.position >>= 1;
                        if (data.position == 0) { data.position = resetValue; data.val = getNextValue(data.index++); }
                        bits |= (resb > 0 ? 1 : 0) * power;
                        power <<= 1;
                    }
                    dictionary[dictSize++] = f(bits);
                    next = dictSize - 1;
                    enlargeIn--;
                    break;
                case 1:
                    bits = 0; maxpower = Math.pow(2, 16); power = 1;
                    while (power != maxpower) {
                        resb = data.val & data.position;
                        data.position >>= 1;
                        if (data.position == 0) { data.position = resetValue; data.val = getNextValue(data.index++); }
                        bits |= (resb > 0 ? 1 : 0) * power;
                        power <<= 1;
                    }
                    dictionary[dictSize++] = f(bits);
                    next = dictSize - 1;
                    enlargeIn--;
                    break;
                case 2:
                    return result.join('');
            }
            if (enlargeIn == 0) { enlargeIn = Math.pow(2, numBits); numBits++; }
            if (dictionary[next]) entry = dictionary[next];
            else if (next === dictSize) entry = w + w.charAt(0);
            else return null;
            result.push(entry);
            dictionary[dictSize++] = w + entry.charAt(0);
            enlargeIn--;
            w = entry;
            if (enlargeIn == 0) { enlargeIn = Math.pow(2, numBits); numBits++; }
        }
    }
    return {
        decompressFromEncodedURIComponent: function (input) {
            if (input == null) return '';
            if (input == '') return null;
            input = input.replace(/ /g, '+');
            return _decompress(input.length, 32, function (index) { return getBaseValue(keyStrUriSafe, input.charAt(index)); });
        }
    };
})();

/* ===== 工具（与课表助手脚本同款） ===== */
var STORE_KEY = 'cqie_cc_viewer_v1';
var ROW_H = 46;
var DEFAULT_PERIOD_TIMES = ['08:30~09:15', '09:25~10:10', '10:30~11:15', '11:25~12:10',
    '14:00~14:45', '14:55~15:40', '16:00~16:45', '16:55~17:40',
    '19:00~19:45', '19:55~20:40', '20:50~21:35', '21:45~22:30'];
var PALETTE = [
    ['#eaf2ff', '#3b74e8'], ['#e9faf0', '#1f9d57'], ['#fff4e5', '#d97a13'],
    ['#f3ecff', '#7a4ddb'], ['#ffeef1', '#d84a6a'], ['#e6faf9', '#0f9488']
];

function $(sel, ctx) { return (ctx || document).querySelector(sel); }
function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (ch) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
}
function pad2(n) { return String(n).padStart ? String(n).padStart(2, '0') : (n < 10 ? '0' + n : '' + n); }
function fmtTime(ts) {
    if (!ts) return '—';
    var d = new Date(ts);
    if (isNaN(d.getTime())) return '—';
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
function djb2(str) {
    var h = 5381;
    str = String(str || '');
    for (var i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0;
    return (h >>> 0).toString(36);
}
function calcWeekNo(semesterStart) {
    var start = new Date(semesterStart);
    if (isNaN(start.getTime())) return 1;
    var no = Math.floor(Math.floor((new Date() - start) / 86400000) / 7) + 1;
    return no >= 1 ? no : 1;
}
function isStandalone() {
    return window.navigator.standalone === true ||
        (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
}

function readData() {
    try {
        var raw = window.localStorage.getItem(STORE_KEY);
        return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
}
function writeData(d) {
    try { window.localStorage.setItem(STORE_KEY, JSON.stringify(d)); return true; }
    catch (e) { return false; }
}

/* ===== hash 数据落地（注意：不清理 hash，iOS 添加主屏时启动 URL 需自带数据） ===== */
function ingestHash() {
    var m = (location.hash || '').match(/#d=([^&]+)/);
    if (!m) return false;
    var json = LZString.decompressFromEncodedURIComponent(m[1]);
    if (!json) return false;
    var data;
    try { data = JSON.parse(json); } catch (e) { return false; }
    if (!data || !data.weeks) return false;
    return writeData(data);
}

/* ===== 渲染 ===== */
function render(weekNo) {
    var data = readData();
    var hero = $('#hero'), hd = $('#hd'), main = $('#main');

    if (!data || !data.weeks || !Object.keys(data.weeks).length) {
        hd.style.display = 'none';
        main.style.display = 'none';
        hero.style.display = 'block';
        $('#hero-standalone').style.display = isStandalone() ? 'block' : 'none';
        $('#hero-browser').style.display = isStandalone() ? 'none' : 'block';
        if (isStandalone()) $('#hero-diag').textContent = '诊断：启动链接长度 ' + location.href.length;
        document.title = '课表';
        return;
    }
    hero.style.display = 'none';
    hd.style.display = 'block';
    main.style.display = 'block';

    var keys = Object.keys(data.weeks).map(function (k) { return parseInt(k, 10); });
    var maxWeek = data.maxWeek || Math.max.apply(null, keys.concat([1]));
    // 当前周按开学日期实时推算，避免同步后长期不更新时周次过期
    var realWeek = data.semesterStart ? calcWeekNo(data.semesterStart) : (data.currentWeekNum || 1);
    if (!weekNo || weekNo < 1) weekNo = realWeek;
    if (weekNo > maxWeek) weekNo = maxWeek;
    var isThisWeek = (weekNo === realWeek);

    var count = (data.weeks[weekNo] || []).length;
    $('#hd-title').textContent = '第' + weekNo + '周课表' + (isThisWeek ? '（本周）' : '');
    $('#hd-sub').textContent = '共 ' + count + ' 项 · 同步于 ' + fmtTime(data.updatedAt) + ' · 离线可看';
    document.title = '第' + weekNo + '周课表';

    var chipsHtml = '';
    for (var w = 1; w <= maxWeek; w++) {
        chipsHtml += '<button type="button" class="chip' + (w === weekNo ? ' on' : '') + '" data-w="' + w + '">' +
            '第' + w + '周' + (w === realWeek ? '•' : '') + '</button>';
    }
    $('#chips').innerHTML = chipsHtml;

    var dayNames = ['一', '二', '三', '四', '五', '六', '日'];
    var monday = null;
    if (data.semesterStart) {
        monday = new Date(data.semesterStart);
        if (!isNaN(monday.getTime())) monday.setDate(monday.getDate() + (weekNo - 1) * 7);
        else monday = null;
    }
    var todayDow = new Date().getDay() || 7;

    var headHtml = '<div class="timecol"><div class="corner"></div></div><div class="days">';
    for (var d = 1; d <= 7; d++) {
        var dateLabel = '';
        if (monday) {
            var dd = new Date(monday);
            dd.setDate(dd.getDate() + d - 1);
            dateLabel = pad2(dd.getMonth() + 1) + '/' + pad2(dd.getDate());
        }
        headHtml += '<div class="dayhead' + ((isThisWeek && d === todayDow) ? ' today' : '') + '">' +
            '<b>周' + dayNames[d - 1] + '</b>' + dateLabel + '</div>';
    }
    headHtml += '</div>';

    var maxPeriod = data.maxPeriod || DEFAULT_PERIOD_TIMES.length;
    var periodTimes = data.periodTimes || DEFAULT_PERIOD_TIMES;
    var gridHtml = '<div class="timecol">';
    for (var p = 1; p <= maxPeriod; p++) {
        var tm = periodTimes[p - 1] || '';
        gridHtml += '<div class="tlabel"><b>' + p + '</b><i>' + escapeHtml(tm.split('~')[0]) + '</i></div>';
    }
    gridHtml += '</div><div class="days">';

    var dayLists = {};
    (data.weeks[weekNo] || []).forEach(function (course) {
        if (!course.allDay && course.day >= 1 && course.day <= 7) {
            (dayLists[course.day] = dayLists[course.day] || []).push(course);
        }
    });

    for (var col = 1; col <= 7; col++) {
        gridHtml += '<div class="daycol">';
        for (var r = 1; r <= maxPeriod; r++) gridHtml += '<div class="bgline"></div>';
        (dayLists[col] || []).forEach(function (course) {
            var s0 = Math.max(1, course.start || 1);
            var span = Math.max(1, (course.end || s0) - s0 + 1);
            var pal = PALETTE[Math.abs(parseInt(djb2(course.name), 36) || 0) % PALETTE.length] || PALETTE[0];
            var cls = 'card';
            if (course.status === '考试') cls += ' exam';
            else if (course.status && course.status.indexOf('临时') >= 0) cls += ' temp';
            var bg = (cls === 'card') ? ('background:' + pal[0] + ';color:' + pal[1] + ';') : '';
            var title = escapeHtml([course.name, course.teacher, course.room,
                course.weekText ? '[' + course.weekText + '周]' : '', course.timeIn].filter(Boolean).join(' '));
            gridHtml += '<div class="' + cls + '" style="top:' + ((s0 - 1) * ROW_H) + 'px;height:' +
                (span * ROW_H - 3) + 'px;' + bg + '" title="' + title + '">' +
                '<b>' + escapeHtml(course.name) + '</b>' +
                (course.teacher ? '<span>' + escapeHtml(course.teacher) + '</span>' : '') +
                (course.room ? '<span>' + escapeHtml(course.room) + '</span>' : '') +
                '<span>' + escapeHtml(course.start + '-' + course.end + '节') + '</span></div>';
        });
        gridHtml += '</div>';
    }
    gridHtml += '</div>';

    var allDay = (data.weeks[weekNo] || []).filter(function (x) { return x.allDay; });
    var allDayHtml = allDay.length ? '<div class="allday">全天：' + allDay.map(function (x) {
        return '<span class="tag">' + escapeHtml(x.name + (x.teacher ? '·' + x.teacher : '')) + '</span>';
    }).join('') + '</div>' : '';

    main.innerHTML = count === 0
        ? '<div class="empty">本周暂无课程安排</div>'
        : allDayHtml + '<div class="gridhead">' + headHtml + '</div>' + '<div class="grid">' + gridHtml + '</div>';
}

/* ===== 落地提示横幅 ===== */
function showBanner() {
    var b = $('#banner');
    var ios = /iP(hone|ad|od)/.test(navigator.userAgent || '');
    $('#banner-text').innerHTML = ios
        ? '✓ 全学期课表已保存到本机。<b>最后一步</b>：点底部分享 →「添加到主屏幕」。桌面图标自带本次数据，离线可看。<br>以后课表更新：教务页点「⇪」→ 落地后再次「添加到主屏幕」覆盖即可。'
        : '✓ 全学期课表已保存到本机。用浏览器菜单「安装应用 / 添加到主屏幕」创建桌面入口，离线可看。';
    b.style.display = 'block';
    $('#banner-close').addEventListener('click', function () { b.style.display = 'none'; });
}

/* ===== 启动 ===== */
$('#chips').addEventListener('click', function (e) {
    var t = e.target;
    if (t && t.dataset && t.dataset.w) render(parseInt(t.dataset.w, 10));
});

var landed = false;
try { landed = ingestHash(); } catch (e) {}
render(0);
if (landed && !isStandalone()) showBanner();

if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
    });
}
})();
</script>
</body>
</html>
